<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyHub – Reviewers and Practice Tests</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button class="brand" id="homeBtn" aria-label="Go to dashboard"><span class="logo" aria-hidden="true">📘</span> StudyHub</button>
  <div class="tools">
    <button class="btn ghost sm" id="fontDown" aria-label="Decrease font size">A−</button>
    <button class="btn ghost sm" id="fontUp" aria-label="Increase font size">A+</button>
    <button class="btn ghost sm" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </div>
</header>
<div id="storageWarn" class="banner" hidden>Browser storage is unavailable, so your scores will not be saved after you close this page.</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<main id="main" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle"></h2><p id="dlgMsg"></p>
  <div class="row end"><button class="btn ghost" id="dlgNo">Cancel</button><button class="btn" id="dlgYes">Confirm</button></div>
</dialog>
<script src="js/reviewers.js"></script>
<script src="js/questions.js"></script>
<script src="js/exam.js"></script>
<script src="js/app.js"></script>
</body>
</html>
